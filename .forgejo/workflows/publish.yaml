name: Publish to package registries

on:
  release:
    # Forgejo emits `published` for a new release; `created` is a GitHub-only
    # release action, so keep both or this workflow never fires on Forgejo.
    types: [created, published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      # id-token: write dropped — it exists to mint the GitHub OIDC token that
      # `npm publish --provenance` attests with. Forgejo issues no such token, so
      # the permission is inert here and provenance is off below.
    steps:
      # Environment setup
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: https://github.com/actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Install dependencies
      - name: Install pnpm
        run: npm i -g pnpm
      - name: Install dependencies with pnpm
        run: pnpm install

      # Update version in code
      - name: Replace version in Version.ts to be semver compatible
        run: sed -i "s/IN-DEV/$(echo $GITHUB_REF | sed 's/refs\/tags\///')/" src/util/Version.ts

      # Build and test
      - name: Build
        run: pnpm build
      - name: Test
        run: pnpm test

      # Generate docs
      - name: Generate docs
        run: pnpm doc

      # Final touches
      - name: Replace version in package.json to be semver compatible
        run: sed -i "s/0.0.0/$(echo $GITHUB_REF | sed 's/refs\/tags\///')/" package.json

      # Publish to registries
      # --provenance removed: it requires a GitHub OIDC id-token to sign the
      # attestation and fails outright without one. The package itself publishes
      # to registry.npmjs.org exactly as before.
      - name: Publish package
        run: npm publish . --access public --no-git-checks

      # Docs deploy is GitHub Pages: JamesIves/github-pages-deploy-action pushes
      # the built docs to the `docs` branch of this repo, and this Forgejo repo is
      # a read-only mirror — a push from CI cannot land. Forgejo also serves no
      # Pages equivalent to publish to. The docs are uploaded as a run artifact
      # instead so the release still produces them; re-enable the step below once
      # this repo is the writable one and something serves the docs branch.
      #
      # - name: Publish Documentation
      #   uses: https://github.com/JamesIves/github-pages-deploy-action@v4
      #   with:
      #     folder: docs
      #     branch: docs
      - name: Upload Documentation
        uses: forgejo/upload-artifact@v5
        with:
          name: docs
          path: docs/
          retention-days: 30
